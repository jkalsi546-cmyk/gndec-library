<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | GNDEC Library</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar (Shared) -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                <img src="images/logo.jpg" alt="Open Books Logo">
                <div class="nav-brand-text">
                    <span class="nav-brand-name">Open Books</span>
                    <span class="nav-brand-sub">GNDEC Library</span>
                </div>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="books.html">All Books</a>
                <a href="contact.html">Contact</a>
                <a href="login.html">Login</a>
            </div>
            <div class="nav-icons">
                <a href="wishlist.html" class="nav-icon-btn active" title="Wishlist">❤<span class="badge wish-badge" style="display: none;">0</span></a>
                <a href="cart.html" class="nav-icon-btn" title="Issue List">📚<span class="badge cart-badge" style="display: none;">0</span></a>
                <button class="theme-toggle nav-icon-btn" title="Toggle Dark/Light Mode">
                    <span class="moon">🌙</span><span class="sun">☀️</span>
                </button>
                <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <!-- Wishlist Content Area -->
    <section class="wishlist-section">
        <div class="container reveal">
            <!-- Back Button -->
            <a href="books.html" style="display: inline-block; margin-bottom: 24px; font-weight: 500;">
                ← Continue Browsing
            </a>
            
            <!-- Wishlist Layout (Populated by JS) -->
            <div id="wishlist-content">
                <!-- Loading State -->
                <div style="text-align: center; padding: 100px 0;">
                    <p style="color: var(--text-muted);">Loading your wishlist...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer (Shared) -->
    <footer class="footer" style="margin-top: auto;">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 40px;">
                <p>&copy; 2026 Open Books — GNDEC Library. Built with <span class="heart">❤</span> for students.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/wishlist.js"></script>
</body>
</html>

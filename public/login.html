<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | GNDEC Library</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar (Shared) -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                <img src="images/logo.jpg" alt="Open Books Logo">
                <div class="nav-brand-text">
                    <span class="nav-brand-name">Open Books</span>
                    <span class="nav-brand-sub">GNDEC Library</span>
                </div>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="books.html">All Books</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="active">Login</a>
            </div>
            <div class="nav-icons">
                <a href="wishlist.html" class="nav-icon-btn" title="Wishlist">❤<span class="badge wish-badge" style="display: none;">0</span></a>
                <a href="cart.html" class="nav-icon-btn" title="Issue List">📚<span class="badge cart-badge" style="display: none;">0</span></a>
                <button class="theme-toggle nav-icon-btn" title="Toggle Dark/Light Mode">
                    <span class="moon">🌙</span><span class="sun">☀️</span>
                </button>
                <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <!-- Login Form Area -->
    <section class="form-section">
        <div class="container" style="display: flex; justify-content: center;">
            <div class="form-container reveal">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Login to manage your issued books and wishlist</p>
                </div>
                
                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="email">College Email ID</label>
                        <input type="email" id="email" placeholder="rollno@gndec.ac.in" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <div style="text-align: right; margin-top: 8px;">
                            <a href="#" style="font-size: 0.85rem;">Forgot Password?</a>
                        </div>
                    </div>
                    
                    <button type="submit" class="form-btn">Login to Library</button>
                    
                    <div class="form-footer">
                        Don't have a library account? <a href="register.html">Register here</a>
                    </div>
                </form>

                <!-- Success Message -->
                <div id="login-success" class="form-success">
                    <div class="icon">✓</div>
                    <h3>Login Successful!</h3>
                    <p>Welcome back to Open Books.</p>
                    <a href="index.html" class="btn-secondary" style="margin-top: 20px; text-decoration: none;">Go to Dashboard</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
